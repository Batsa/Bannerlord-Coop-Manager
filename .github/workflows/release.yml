name: Publish BCS Tool Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish BCS Tool
    runs-on: windows-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            6.0.x
            10.0.x

      - name: Verify tag matches BCSTool.csproj version
        shell: pwsh
        run: |
          $versionNode = Select-Xml `
            -Path ".\BCSTool\BCSTool.csproj" `
            -XPath "/Project/PropertyGroup/Version"

          if ($null -eq $versionNode) {
              throw "Could not find <Version> in BCSTool.csproj."
          }

          $projectVersion = $versionNode.Node.InnerText.Trim()
          $expectedTag = "v$projectVersion"
          $actualTag = "${{ github.ref_name }}"

          Write-Host "Project version: $projectVersion"
          Write-Host "Expected tag:    $expectedTag"
          Write-Host "Actual tag:      $actualTag"

          if ($actualTag -ne $expectedTag) {
              throw "Release tag '$actualTag' does not match project version '$projectVersion'. Expected '$expectedTag'."
          }

      - name: Publish BCS Tool
        shell: pwsh
        run: |
          & ".\BCSTool\Publish-SingleExe.ps1"

      - name: Run regression checks
        shell: pwsh
        run: |
          dotnet build ".\BCSTool.RegressionTests\BCSTool.RegressionTests.csproj" `
            -c Release `
            --disable-build-servers
          dotnet ".\BCSTool.RegressionTests\bin\Release\net10.0-windows\BCSTool.RegressionTests.dll"

      - name: Verify release executable
        shell: pwsh
        run: |
          $exe = ".\BCSTool\publish\BCS Tool.exe"
          $bootstrap = ".\BCSTool\publish\BCSTool.RuntimeBootstrap.dll"
          $companions = @(
            ".\BCSTool\publish\START-HERE.txt",
            ".\BCSTool\publish\README.md",
            ".\BCSTool\publish\LICENSE",
            ".\BCSTool\publish\NOTICE.md"
          )

          if (-not (Test-Path $exe)) {
            throw "Expected release executable was not produced: $exe"
          }
          if (-not (Test-Path $bootstrap)) {
            throw "Expected runtime bootstrap was not produced: $bootstrap"
          }
          foreach ($companion in $companions) {
            if (-not (Test-Path $companion)) {
              throw "Expected release companion file was not produced: $companion"
            }
          }

          Write-Host "Release files:"
          $releaseFiles = @($exe, $bootstrap) + $companions
          Get-Item -LiteralPath $releaseFiles | Format-Table Name, Length, LastWriteTime

      - name: Package complete application
        shell: pwsh
        run: |
          $archive = ".\BCSTool\publish\Bannerlord-Coop-Manager-${{ github.ref_name }}-win-x64.zip"
          Compress-Archive `
            -LiteralPath ".\BCSTool\publish\BCS Tool.exe", ".\BCSTool\publish\BCSTool.RuntimeBootstrap.dll", ".\BCSTool\publish\START-HERE.txt", ".\BCSTool\publish\README.md", ".\BCSTool\publish\LICENSE", ".\BCSTool\publish\NOTICE.md" `
            -DestinationPath $archive `
            -CompressionLevel Optimal

          Get-Item $archive | Format-List Name, Length, LastWriteTime

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $archive = ".\BCSTool\publish\Bannerlord-Coop-Manager-${{ github.ref_name }}-win-x64.zip"
          $checksumFile = "$archive.sha256"
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()

          "$hash  $([IO.Path]::GetFileName($archive))" |
              Set-Content -Path $checksumFile -Encoding ascii

          Write-Host "SHA-256:"
          Get-Content $checksumFile

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $archive = ".\BCSTool\publish\Bannerlord-Coop-Manager-${{ github.ref_name }}-win-x64.zip"
          $notes = @"
          ## Install

          1. Download **$([IO.Path]::GetFileName($archive))** below.
          2. Extract the ZIP completely.
          3. Run **BCS Tool.exe** from the extracted folder.

          No .NET or source build is required. Keep BCSTool.RuntimeBootstrap.dll
          beside the executable. The ZIP contains the manager only; Bannerlord, Coop,
          EOE, and the dedicated-server package remain separate prerequisites. This is
          a preview EOE compatibility build; see the included README for setup, current
          progress, and known limitations. The executable is not digitally signed, so
          verify the adjacent SHA-256 file before running it.
          "@
          $arguments = @(
            "release", "create", $tag,
            $archive, "$archive.sha256",
            "--verify-tag",
            "--title", "Bannerlord Coop Manager $tag",
            "--notes", $notes
          )
          if ($tag.Contains("-")) {
            $arguments += "--prerelease"
            $arguments += "--latest=false"
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
